[project]
authors = [
  {name = "Your Name", email = "your.email@example.com"},
]
description = "Add your description here"
keywords = ["your", "keywords", "here"]
license = {file = "LICENSE.txt"}
name = "backend"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

dependencies = [
  "boto3>=1.37.2 ; sys_platform == 'linux'",
  "celery>=5.4.0",
  "channels>=4.2.0",
  "channels-redis>=4.2.1",
  "dj-rest-auth>=7.0.1",
  "django==4.2.20",
  "django-allauth[mfa,socialaccount]>=65.5.0",
  "django-celery-beat>=2.7.0",
  "django-cors-headers>=4.7.0",
  "django-redis>=5.4.0",
  "django-storages[s3]>=1.14.5",
  "djangorestframework>=3.15.2",
  "djangorestframework-simplejwt>=5.5.0",
  "flower>=2.0.1",
  "pillow>=11.1.0",
  "pip-tools>=7.4.1",
  "pre-commit>=4.1.0",
  "psycopg2>=2.9.10 ; sys_platform == 'linux'",
  "psycopg2-binary>=2.9.10 ; sys_platform == 'win32'",
  "pyotp>=2.9.0",
  "python-dotenv>=1.0.1",
  "qrcode>=8.0",
  "redis>=5.2.1",
]
[project.optional-dependencies]
dev = [
  "drf-spectacular>=0.28.0",
  "rich>=13.9.4",
]
lint = [
  "ruff>=0.9.6",
]
test = []

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv", # project extra excludes
  ".git",
  ".venv",
  "venv",
  "**/Lib/**",
  "**/migrations/**",
  "**/static/**",
  "**/templates/**",
]

fix = true
indent-width = 4
line-length = 88
preview = true
target-version = "py312"
unsafe-fixes = true

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
ignore = [
  "PGH004",
  "PLR2004",
  "RUF012",
  "PLR6301",
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
  "N", # pep8-naming  #   "T20", # flake8-print
  "PL", # pylint
  "RUF", # ruff-specific rules,
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "W505",
  "PT018",
  "SIM101",
  "SIM114",
  "PLE1142",
  "RUF100",
  "F404",
  "TCH",
  "B",
  "C4",
  "UP",
  "N",
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/core/settings/dev.py" = ["F403", "F405"]

[tool.ruff.format]
docstring-code-format = false
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
preview = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["apps", "core"]

[tool.uv]
link-mode = "copy"

[tool.pyright]
ignore = ["*"]
typeCheckingMode = "off"

[dependency-groups]
dev = [
    "kolo>=2.40.0",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 88
