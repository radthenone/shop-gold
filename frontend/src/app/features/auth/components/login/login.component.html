<h2>{{ 'LABEL.LOGIN' | translate }}</h2>
<div *ngIf="navSuccessMessage" class="alert alert-success">{{ navSuccessMessage }}</div>

<!-- login form -->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <!-- email label -->
  <div class="mb-3">
    <label for="email" class="form-label">{{ 'FIELD.EMAIL' | translate }}</label>
    <input
      id="email"
      name="email"
      type="email"
      formControlName="email"
      class="form-control"
      [ngClass]="{ 'is-invalid': submitted && field['email'].errors }"
      [placeholder]="'FIELD_PLACEHOLDER.EMAIL' | translate"
      autocomplete="username email"
    />
    <div *ngIf="submitted && getFieldErrors('email')" class="invalid-feedback">
      <div *ngFor="let error of getFieldErrors('email')">{{ error.message }}</div>
    </div>
  </div>

  <!-- password label -->
  <div class="mb-3">
    <label for="password" class="form-label">{{ 'FIELD.PASSWORD' | translate }}</label>
    <input
      id="password"
      name="password"
      type="password"
      formControlName="password"
      class="form-control"
      [ngClass]="{ 'is-invalid': submitted && field['password'].errors }"
      [placeholder]="'FIELD_PLACEHOLDER.PASSWORD' | translate"
      autocomplete="current-password"
    />
    <div *ngIf="submitted && getFieldErrors('password')" class="invalid-feedback">
      <div *ngFor="let error of getFieldErrors('password')">{{ error.message }}</div>
    </div>
  </div>

  <!-- login button -->
  <div class="d-grid gap-2">
    <button type="submit" class="btn btn-primary">{{ 'BUTTON.LOGIN' | translate }}</button>
  </div>
  <div *ngIf="submitted && getFormErrors">
    <div class="alert alert-danger mt-3">
      <div *ngFor="let error of getFormErrors()">{{ error.message }}</div>
    </div>
  </div>
</form>

<!-- Back to Register -->
<app-back-to [label]="'BUTTON.BACK_TO_REGISTRATION'" [route]="['auth', 'register']"></app-back-to>
