<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Logowanie</h2>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Email"
        [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="validation-error">
        <span *ngIf="loginForm.get('email')?.errors?.['required']">Email jest wymagany</span>
        <span *ngIf="loginForm.get('email')?.errors?.['email']">Podaj prawidłowy adres email</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Hasło</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Hasło"
        [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="validation-error">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Hasło jest wymagane</span>
      </div>
    </div>

    <div class="error" *ngIf="error">
      {{ error }}
    </div>

    <button type="submit" [disabled]="!loginForm.valid">
      Zaloguj
    </button>

    <div class="links">
      <a routerLink="/auth/register">Zarejestruj się</a>
      <a routerLink="/auth/reset-password">Zapomniałeś hasła?</a>
    </div>

    <div *ngIf="isLoading" class="loading">
      <div class="spinner"></div>
      <span>Logowanie...</span>
    </div>
  </form>
</div>
